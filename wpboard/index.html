:root{--bg:#F2F6F3;--card:#fff;--ink:#16241D;--mut:#68786F;--edge:#E1E8E4;--band1:#0A5C36;--band2:#12854F;--bandTx:#fff;--grn:#1E8E5A;--red:#C62828;--amb:#B7791F;--tile:#F0F5F2;--trk:#E7EEE9}
[data-th="dark"]{--bg:#0B1E17;--card:#122A20;--ink:#ECF4EF;--mut:#8FAF9F;--edge:#1E3A2D;--band1:#0F3B29;--band2:#155C3E;--bandTx:#EBD9A2;--grn:#5FCF95;--red:#FF8A7A;--amb:#FFC24B;--tile:#163226;--trk:#1B3A2C}
*{margin:0;padding:0;box-sizing:border-box;font-family:'BwGradual',system-ui,sans-serif}
body{background:var(--bg);color:var(--ink);min-height:100vh;transition:background .3s}
.ic{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-2.5px;margin-right:7px}
.ic.s{width:13px;height:13px;margin-right:6px}
#passcode-screen{position:fixed;inset:0;background:#0F2920;z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'BwGradual',sans-serif;animation:pc-in .35s ease forwards}
#passcode-screen.pc-exit{animation:pc-out .4s ease forwards}
@keyframes pc-in{from{opacity:0}to{opacity:1}}
@keyframes pc-out{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.04)}}
#passcode-screen .pc-brand{display:flex;align-items:center;gap:10px;margin-bottom:8px}
#passcode-screen .pc-brand img{height:32px;width:auto;filter:brightness(0) invert(1);opacity:.9}
#passcode-screen .pc-app-name{font-family:'BwGradualEB','BwGradual',sans-serif;font-size:15px;font-weight:900;color:#fff;letter-spacing:2px;opacity:.85}
#passcode-screen .pc-logo{margin-bottom:32px;display:flex;flex-direction:column;align-items:center}
#passcode-screen .pc-title{color:rgba(255,255,255,.55);font-size:9px;font-weight:700;letter-spacing:3px;text-transform:uppercase;margin-bottom:8px}
#passcode-screen .pc-sub{color:rgba(255,255,255,.3);font-size:10px;letter-spacing:1px;margin-bottom:36px}
#passcode-screen .pc-dots{display:flex;gap:16px;margin-bottom:36px}
#passcode-screen .pc-dot{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3);transition:all .2s}
#passcode-screen .pc-dot.filled{background:#fff;border-color:#fff}
#passcode-screen .pc-dot.error{background:#EF4444;border-color:#EF4444;animation:pcShake .3s ease}
@keyframes pcShake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-4px)}40%,80%{transform:translateX(4px)}}
#passcode-screen .pc-grid{display:grid;grid-template-columns:repeat(3,72px);grid-template-rows:repeat(4,72px);gap:10px}
#passcode-screen .pc-key{background:rgba(255,255,255,.1);border:none;border-radius:50%;color:#fff;font-family:'BwGradualEB','BwGradual',sans-serif;font-size:22px;font-weight:900;cursor:pointer;transition:background .1s;-webkit-tap-highlight-color:transparent}
#passcode-screen .pc-key:active{background:rgba(255,255,255,.25)}
#passcode-screen .pc-key.pc-del{background:transparent;font-size:18px}
#passcode-screen .pc-key.pc-empty{background:transparent;cursor:default;pointer-events:none}
#passcode-screen .pc-err{color:#FCA5A5;font-size:11px;font-weight:700;letter-spacing:1.5px;margin-top:16px;height:20px;text-align:center}
header{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,var(--band1),var(--band2));color:var(--bandTx);padding:13px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;box-shadow:0 2px 10px rgba(6,30,18,.25)}
header h1{font-size:17px;font-weight:800;flex:1;min-width:220px;display:flex;align-items:center}
header h1 .ic{width:19px;height:19px}
header .day{font-weight:800;font-size:14px}
.btn{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:inherit;border-radius:10px;padding:7px 11px;font-size:12px;cursor:pointer;font-weight:700;display:inline-flex;align-items:center}
.btn .ic{margin-right:5px}
#pace{padding:9px 16px;text-align:center;font-size:13px;font-weight:800;background:linear-gradient(90deg,#FFF1C9,#FFE9AE);color:#7A5200}
[data-th="dark"] #pace{background:linear-gradient(90deg,#2A2410,#33290F);color:#FFC24B}
#board{max-width:1500px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--edge);border-radius:18px;overflow:hidden;box-shadow:0 2px 10px rgba(10,40,25,.06)}
.card h3{background:linear-gradient(120deg,var(--band1),var(--band2));color:var(--bandTx);font-size:12.5px;letter-spacing:.7px;padding:10px 14px;font-weight:800;display:flex;align-items:center}
.pad{padding:13px 15px;overflow:hidden}
.ovw{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:800;color:var(--grn)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;flex:1}
.tile{background:var(--tile);border-radius:13px;padding:8px 5px;text-align:center;border:1px solid var(--edge);min-width:0}
.tile .l{font-size:9px;color:var(--mut);font-weight:800;letter-spacing:.4px}
.tile .v{font-size:20px;font-weight:800;margin-top:2px;white-space:nowrap}
.v.red{color:var(--red)}.v.amb{color:var(--amb)}.v.grn{color:var(--grn)}
table{width:100%;border-collapse:collapse;font-size:12.5px;table-layout:fixed}
th{color:var(--mut);font-size:9.5px;letter-spacing:.5px;text-align:left;padding:5px 7px;border-bottom:1.5px solid var(--edge)}
td{padding:6.5px 7px;border-bottom:1px solid var(--edge)}
tr:last-child td{border-bottom:none}
td.n{font-weight:800;overflow-wrap:break-word}
td.c{text-align:center;white-space:nowrap}
td.desc{color:var(--mut);font-size:10.5px;line-height:1.35;max-width:200px}
.dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:7px;vertical-align:1px}
.bar{height:9px;border-radius:6px;background:var(--trk);overflow:hidden;width:100%}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--grn),#7ADFAF);border-radius:6px;transition:width .9s}
.bar.blue i{background:linear-gradient(90deg,#2F6FB2,#7FB3E8)}
.bar.amb i{background:linear-gradient(90deg,#B7791F,#EFC15E)}
.bar.red i{background:linear-gradient(90deg,#C62828,#E5786F)}
.pct{font-weight:800;color:var(--grn)}

let _pcE='';
function _pcBuild(){
  const s=document.getElementById('passcode-screen');
  if(!s) return;
  const keys=[1,2,3,4,5,6,7,8,9,'',0,'DEL']; let kh='';
  keys.forEach(k=>{
    if(k==='') kh+='<button class="pc-key pc-empty" disabled></button>';
    else if(k==='DEL') kh+='<button class="pc-key pc-del" data-k="del">&#9003;</button>';
    else kh+='<button class="pc-key" data-k="'+k+'">'+k+'</button>';
  });
  s.innerHTML=LOCK_TPL.replace('%%KEYS%%',kh);
  s.querySelectorAll('.pc-key').forEach(b=>b.addEventListener('click',()=>_pcKey(b.dataset.k)));
}
function _pcDots(){document.querySelectorAll('#passcode-screen .pc-dot').forEach((d,i)=>d.classList.toggle('filled',i<_pcE.length));}
function _pcKey(k){
  const e=document.getElementById('pc-err');
  if(k==='del'){_pcE=_pcE.slice(0,-1);_pcDots();if(e)e.textContent='';return;}
  if(_pcE.length>=3)return;
  _pcE+=String(k);_pcDots();
  if(_pcE.length===3){
    if(_pcE==='321'){
      localStorage.setItem('wpb_t',Date.now());
      const s=document.getElementById('passcode-screen');
      s.classList.add('pc-exit');
      s.addEventListener('animationend',()=>s.remove(),{once:true});
      unlock();
    }else{
      if(e)e.textContent='WRONG CODE';
      document.querySelectorAll('#passcode-screen .pc-dot').forEach(d=>d.classList.add('error'));
      _pcE='';
      setTimeout(()=>{_pcDots();document.querySelectorAll('#passcode-screen .pc-dot').forEach(d=>d.classList.remove('error'));if(e)e.textContent='';},900);
    }
  }
}
_pcBuild();

function duo(label,val,pct,cls){return `<div class="duo"><div class="t"><span>${label}</span><span>${val}</span></div>${bar(pct,cls)}</div>`;}

async function load(){
  let s; try{ s=await (await fetch('wp_stats.json?ts='+Date.now())).json(); }
  catch(e){ document.getElementById('board').innerHTML='<div class="card"><div class="pad">wp_stats.json unavailable</div></div>'; return; }
  render(s);
}
function render(s){
  const today=new Date(); const oos=new Date(s.oos), bis=new Date(s.bis);
  const day=Math.floor((today-oos)/864e5)+1, tot=Math.round((bis-oos)/864e5)+1;
  const left=Math.max(0,Math.ceil((bis-today)/864e5));
  const need=left?Math.ceil(s.kpi.o/left):s.kpi.o;
  const avg7=(s.daily.slice(-7).reduce((a,x)=>a+x.s,0)/7).toFixed(1);
  const done=P(s.kpi.c,s.kpi.t), tp=Math.min(100,Math.round(day/tot*100));
  document.getElementById('day').textContent=`DAY ${day}/${tot} · B.I.S ${D1(s.bis)}`;
  document.getElementById('pace').textContent=`Completed ${done}% vs Time ${tp}% · Days left ${left} · Need ${need}/day vs avg ${avg7}/day`;
  document.getElementById('ftr').textContent=`Updated ${s.updated} · auto-refresh · Saudia Technic CA&QC`;
  const matL=Math.max(0,Math.ceil((new Date(s.material)-today)/864e5));
  const R=46, CIR=2*Math.PI*R;
  let h='';
  h+=`<div class="card"><h3>${ic('gauge')}OVERVIEW</h3><div class="pad">
      <div class="ovw">
        <div class="ring"><svg width="112" height="112">
          <circle cx="56" cy="56" r="${R}" stroke="var(--trk)" stroke-width="12" fill="none"/>
          <circle cx="56" cy="56" r="${R}" stroke="var(--grn)" stroke-width="12" fill="none" stroke-linecap="round"
            stroke-dasharray="${CIR}" stroke-dashoffset="${CIR*(1-done/100)}"/>
        </svg><div class="v">${done}%</div></div>
        <div class="tiles">
          <div class="tile"><div class="l">TOTAL</div><div class="v">${s.kpi.t}</div></div>
          <div class="tile"><div class="l">CLOSED</div><div class="v grn">${s.kpi.c}</div></div>
          <div class="tile"><div class="l">OPEN</div><div class="v amb">${s.kpi.o}</div></div>
          <div class="tile"><div class="l">AOG WO</div><div class="v red">${s.kpi.aog}</div></div>
          <div class="tile"><div class="l">CRITICAL</div><div class="v amb">${s.kpi.crit}</div></div>
          <div class="tile"><div class="l">ACCESS WO</div><div class="v amb">${s.kpi.accO}</div></div>
        </div>
      </div>
      ${duo('Cabin closure', s.kpi.c+' / '+s.kpi.t+'  ·  '+done+'%', done)}
      ${duo('Time elapsed', 'Day '+day+' / '+tot+'  ·  '+tp+'%', tp, 'blue')}
      ${matL<=5?`<div class="risk">${ic('alert')}MATERIAL CUTOFF — ${matL} DAY${matL==1?'':'S'}</div>`:''}
      </div></div>`;
  h+=`<div class="card"><h3>${ic('flag')}MILESTONES & PACE</h3><div class="pad">
      ${[['land',"O.O.S",s.oos],['search','FINDINGS CUTOFF',s.findings],['box','MATERIAL CUTOFF',s.material],['lock','CLOSE-UP',s.closeup],['plane','B.I.S',s.bis]].map(([icn,n,d])=>{
        const dd=Math.ceil((new Date(d)-today)/864e5);
        return `<div class="ms"><span>${ic(icn,'s')}${n}</span><b>${D1(d)} ${dd>=0?`<span style="color:var(--amb)">· in ${dd}d</span>`:'<span style="color:var(--grn)">done</span>'}</b></div>`;}).join('')}
      <div class="tiles" style="margin-top:12px">
        <div class="tile"><div class="l">DAYS LEFT</div><div class="v">${left}</div></div>
        <div class="tile"><div class="l">NEED / DAY</div><div class="v amb">${need}</div></div>
        <div class="tile"><div class="l">7-DAY AVG</div><div class="v ${+avg7>=need?'grn':'red'}">${avg7}</div></div>
      </div></div></div>`;
  h+=`<div class="card"><h3>${ic('lock')}ACCESS CARDS</h3><div class="pad">
      ${duo('Still Open', s.kpi.accO+' / '+s.kpi.accT+'  ·  '+P(s.kpi.accO,s.kpi.accT)+'%', P(s.kpi.accO,s.kpi.accT), 'red')}
      ${duo('Closed', (s.kpi.accT-s.kpi.accO)+' / '+s.kpi.accT+'  ·  '+P(s.kpi.accT-s.kpi.accO,s.kpi.accT)+'%', P(s.kpi.accT-s.kpi.accO,s.kpi.accT))}
      <div style="font-size:11px;color:var(--mut);font-weight:700;margin-top:4px">Close-up ${D1(s.closeup)} — access cards gate reinstallation</div>
      </div></div>`;
  h+=`<div class="card"><h3>${ic('chart')}DAILY CLOSURES — LAST 10 DAYS</h3><div class="pad">
      <div class="chart">${s.daily.map(x=>{const mx=Math.max(...s.daily.map(y=>y.s),1);
        return `<div class="col"><div class="dv">${x.s||''}</div><div class="stick" style="height:${Math.max(4,x.s/mx*84)}px"></div><div class="dl">${D1(x.d).split(' ')[0]}</div></div>`;}).join('')}</div>
      <div class="duo"><div class="t"><span>S-curve vs plan (${s.plan})</span><span style="color:${s.kpi.c>=s.plan?'var(--grn)':'var(--red)'};font-weight:800">${s.kpi.c-s.plan>=0?'+':''}${s.kpi.c-s.plan}</span></div>${bar(P(s.kpi.c,s.plan),s.kpi.c>=s.plan?'':'amb')}</div>
      </div></div>`;
  const tbl=rows=>rows.map(x=>{
    const p=P(x.c,x.t), col=CATC[x.n]||SPC[x.n]||'var(--grn)';
    return `<tr><td class="n"><span class="dot" style="background:${col}"></span>${NM(x.n)}</td>
      <td class="c">${x.c} / ${x.t}</td><td class="c pct">${p}%</td>
      <td class="c" style="color:var(--mut)">${x.t-x.c}</td><td>${bar(p)}</td></tr>`;}).join('');
  h+=`<div class="card"><h3>${ic('compass')}BY SOURCE</h3><div class="pad"><table>
      <tr><th style="width:34%">SOURCE</th><th style="width:20%;text-align:center">CLOSED</th><th style="width:12%;text-align:center">%</th><th style="width:11%;text-align:center">LEFT</th><th style="width:23%"></th></tr>
      ${tbl(s.sources)}</table></div></div>`;
  h+=`<div class="card"><h3>${ic('folder')}BY CATEGORY</h3><div class="pad"><table>
      <tr><th style="width:34%">CATEGORY</th><th style="width:20%;text-align:center">CLOSED</th><th style="width:12%;text-align:center">%</th><th style="width:11%;text-align:center">LEFT</th><th style="width:23%"></th></tr>
      ${tbl(s.cats.filter(x=>x.t>0))}</table></div></div>`;
  h+=`<div class="card"><h3>${ic('users')}SPECIALTY — CLOSURE</h3><div class="pad"><table>
      <tr><th style="width:30%">TRADE</th><th style="width:21%;text-align:center">CLOSED</th><th style="width:13%;text-align:center">%</th><th style="width:12%;text-align:center">LEFT</th><th style="width:24%"></th></tr>
      ${tbl(s.spec)}</table></div></div>`;
  const bmax=Math.max(...s.spec.map(x=>x.bkd),1);
  h+=`<div class="card"><h3>${ic('clock')}WORKLOAD BY SPECIALTY (MH)</h3><div class="pad"><table>
      <tr><th style="width:28%">TRADE</th><th style="width:17%;text-align:center">EST</th><th style="width:19%;text-align:center">BOOKED</th><th style="width:36%"></th></tr>
      ${s.spec.map(x=>`<tr><td class="n"><span class="dot" style="background:${SPC[x.n]}"></span>${NM(x.n)}</td>
        <td class="c" style="color:var(--mut)">${F(x.est)}</td><td class="c" style="font-weight:800">${F(x.bkd)}</td>
        <td>${bar(x.bkd/bmax*100,'amb')}</td></tr>`).join('')}</table></div></div>`;
  h+=`<div class="card"><h3>${ic('pin')}BY AREA</h3><div class="pad"><table>
      <tr><th style="width:14%">AREA</th><th style="width:20%;text-align:center">CLOSED</th><th style="width:11%;text-align:center">%</th><th style="width:14%;text-align:center">EST</th><th style="width:15%;text-align:center">BKD</th><th style="width:26%"></th></tr>
      ${s.area.map(x=>`<tr><td class="n">${x.n}</td><td class="c">${x.c} / ${x.t}</td><td class="c pct">${P(x.c,x.t)}%</td>
        <td class="c" style="color:var(--mut)">${F(x.est)}</td><td class="c">${F(x.bkd)}</td><td>${bar(P(x.c,x.t))}</td></tr>`).join('')}</table></div></div>`;
  const nc={c:s.pkg.c-s.kpi.c,t:s.pkg.t-s.kpi.t};
  h+=`<div class="card"><h3>${ic('plane')}AIRCRAFT PACKAGE — ALL TRADES</h3><div class="pad">
      <div class="pk">
        <div class="tile"><div class="l">TOTAL</div><div class="v">${F(s.pkg.t)}</div></div>
        <div class="tile"><div class="l">CLOSED</div><div class="v grn">${F(s.pkg.c)}</div></div>
        <div class="tile"><div class="l">OPEN</div><div class="v amb">${F(s.pkg.t-s.pkg.c)}</div></div>
        <div class="tile"><div class="l">DONE</div><div class="v grn">${P(s.pkg.c,s.pkg.t)}%</div></div>
      </div>
      ${duo('Cabin', s.kpi.c+' / '+s.kpi.t+'  ·  '+done+'%', done)}
      ${duo('Non-cabin', nc.c+' / '+nc.t+'  ·  '+P(nc.c,nc.t)+'%', P(nc.c,nc.t), 'blue')}
      ${duo('Package', s.pkg.c+' / '+s.pkg.t+'  ·  '+P(s.pkg.c,s.pkg.t)+'%', P(s.pkg.c,s.pkg.t), 'amb')}
      <table style="margin-top:8px">
        <tr><th style="width:28%">MH</th><th style="width:25%;text-align:center">CABIN</th><th style="width:26%;text-align:center">NON-CABIN</th><th style="width:21%;text-align:center">SHARE</th></tr>
        <tr><td class="n">ESTIMATED</td><td class="c">${F(s.cab.est)}h</td><td class="c">${F(s.pkg.est-s.cab.est)}h</td><td class="c pct">${P(s.cab.est,s.pkg.est)}%</td></tr>
        <tr><td class="n">BOOKED</td><td class="c">${F(s.cab.bkd)}h</td><td class="c">${F(s.pkg.bkd-s.cab.bkd)}h</td><td class="c pct">${P(s.cab.bkd,s.pkg.bkd)}%</td></tr>
      </table></div></div>`;
  const imax=Math.max(...s.stalled.map(x=>x.idle),1);
  h+=`<div class="card"><h3>${ic('hour')}STALLED — TOP 8</h3><div class="pad"><table>
      <tr><th style="width:22%">WO</th><th style="width:42%">DESCRIPTION</th><th style="width:13%;text-align:center">IDLE</th><th style="width:23%"></th></tr>
      ${s.stalled.map(x=>`<tr><td class="n">${x.wo}</td><td class="desc">${x.d.length>48?x.d.slice(0,48)+'…':x.d}</td>
        <td class="c" style="color:var(--red);font-weight:800">${F(x.idle)}</td>
        <td>${bar(x.idle/imax*100,'red')}</td></tr>`).join('')}</table></div></div>`;
  document.getElementById('board').innerHTML=h;
}
async function exportImg(mode){
  const b=document.body;
  b.classList.add(mode==='m'?'exporting':'exporting-wide');
  try{
    if(document.fonts&&document.fonts.ready) await document.fonts.ready;
    await new Promise(r=>setTimeout(r,400));
    const el=document.getElementById('cap');
    const w=el.scrollWidth, hh=el.scrollHeight;
    // سقوف آيفون: مساحة كلية + كل بُعد على حدة
    const scale=Math.max(0.4, Math.min(2, Math.sqrt(11e6/Math.max(1,w*hh)), 7000/hh, 7000/w));
    const canvas=await html2canvas(el,{scale, backgroundColor:getComputedStyle(b).backgroundColor, useCORS:true});
    if(canvas.width*canvas.height>16e6) throw new Error('capture too large for this device');
    b.classList.remove('exporting','exporting-wide');
    const fname='HZ-ASD_board_'+(mode==='m'?'mobile':'screen')+'.png';
    const durl=canvas.toDataURL('image/png');
    const mobile=('ontouchstart' in window)||navigator.maxTouchPoints>1;
    if(!mobile){
      const a=document.createElement('a'); a.download=fname; a.href=durl; a.click();
      return;
    }
    let ov=document.getElementById('shotOv'); if(ov) ov.remove();
    ov=document.createElement('div'); ov.id='shotOv';
    ov.style.cssText='position:fixed;inset:0;background:rgba(8,25,18,.95);z-index:9999;display:flex;flex-direction:column;align-items:center;padding:14px;overflow:auto';
    const hint=document.createElement('div');
    hint.style.cssText='color:#fff;font-weight:800;font-size:12.5px;margin:4px 0 10px;text-align:center';
    hint.textContent='Tap Share, or press & hold the image to save';
    const img=document.createElement('img');
    img.src=durl; img.style.cssText='max-width:100%;border-radius:12px';
    const bar=document.createElement('div');
    bar.style.cssText='display:flex;gap:10px;margin-top:14px';
    const mkBtn=(t,bg)=>{const x=document.createElement('button');
      x.textContent=t; x.style.cssText='background:'+bg+';color:#fff;border:none;border-radius:11px;padding:12px 24px;font-weight:800;font-size:14px'; return x;};
    const sh=mkBtn('Share / Save','#1E8E5A'), cl=mkBtn('Close','#3B4A43');
    sh.onclick=async ()=>{           // نداء المشاركة داخل الضغطة = إذن طازج (يرضي كروم)
      try{
        const blob=await (await fetch(durl)).blob();
        const file=new File([blob], fname, {type:'image/png'});
        if(navigator.canShare&&navigator.canShare({files:[file]})){
          await navigator.share({files:[file], title:'HZ-ASD Board'});
        } else if(navigator.share){
          await navigator.share({title:'HZ-ASD Board'});
          alert('This browser cannot share files - press & hold the image instead');
        } else {
          alert('Sharing unavailable - press & hold the image to save');
        }
      }catch(e){ if(e.name!=='AbortError') alert('Share failed: '+e.message); }
    };
    cl.onclick=()=>ov.remove();
    bar.appendChild(sh); bar.appendChild(cl);
    ov.appendChild(hint); ov.appendChild(img); ov.appendChild(bar);
    document.body.appendChild(ov);
  }catch(err){
    b.classList.remove('exporting','exporting-wide');
    alert('Export failed: '+err.message);
  }
}
setInterval(load, 5*60*1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&document.getElementById('lock').style.display==='none')load();});
</script></body></html>
